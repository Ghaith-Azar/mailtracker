services:
  - type: web
    name: mailtracker
    runtime: python
    plan: free
    healthCheckPath: /health
    buildCommand: pip install -r requirements.txt
    startCommand: python3 app.py
    envVars:
      - key: ADMIN_PASSWORD
        sync: false        # Render asks you for this when you create the blueprint
      - key: BASE_URL
        sync: false        # e.g. https://mailtracker.onrender.com (no trailing slash)
      - key: TZ_NAME
        value: Asia/Amman
