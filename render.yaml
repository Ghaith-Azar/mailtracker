services:
  - type: web
    name: mailtracker
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python3 app.py
    envVars:
      - key: ADMIN_PASSWORD
        sync: false        # Render asks you for this
      - key: DATABASE_URL
        sync: false        # Neon connection string (keeps your history permanently)
      - key: TZ_NAME
        value: Asia/Amman
