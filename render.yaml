services:
  - type: web
    name: mailtracker
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python3 app.py
    envVars:
      - key: ADMIN_PASSWORD
        sync: false        # Render asks you for this
      - key: TURSO_DATABASE_URL
        sync: false        # from: turso db show mailtracker --url
      - key: TURSO_AUTH_TOKEN
        sync: false        # from: turso db tokens create mailtracker
      - key: TZ_NAME
        value: Asia/Amman
